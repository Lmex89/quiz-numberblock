<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contador Dinámico</title>
  <link rel="stylesheet" href="/css/styles.css">
</head>
<body>
  <div class="floating-nums">
    <span>1</span><span>2</span><span>3</span><span>4</span><span>5</span>
  </div>

  <div class="container stagger">
    <h1 class="home-title"><span class="emoji">🎮</span> Contador</h1>
    <p class="home-sub">¿Qué quieres practicar?</p>

    <div class="cards">
      <a href="/count.html" class="card card-1">
        <span class="card-icon">🔢</span>
        <span class="card-label">¿Cuántos hay?</span>
        <span class="card-desc">Cuenta las imágenes</span>
      </a>
      <a href="/sum.html" class="card card-2">
        <span class="card-icon">➕</span>
        <span class="card-label">¿Cuánto suman?</span>
        <span class="card-desc">Suma los valores</span>
      </a>
    </div>
  </div>
</body>
</html>
